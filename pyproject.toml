[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kernelpack-jax"
version = "0.1.0"
description = "JAX-native meshfree geometry, RBF-FD, and PDE solvers."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Varun Shankar"},
]
keywords = ["jax", "meshfree", "rbf-fd", "pde", "scientific-computing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "jax>=0.10.0,<0.11",
  "jaxlib>=0.10.0,<0.11",
  "lineax>=0.1.1",
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.urls]
Homepage = "https://github.com/VarShankar/kernelpack-jax"
Repository = "https://github.com/VarShankar/kernelpack-jax"
Issues = "https://github.com/VarShankar/kernelpack-jax/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]
examples = [
  "matplotlib>=3.9",
]
warp = [
  "warp-lang>=1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
