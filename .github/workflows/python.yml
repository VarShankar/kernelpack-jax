name: Python tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Test
        env:
          JAX_PLATFORMS: cpu
        run: python -m pytest -q
      - name: Build distribution
        run: python -m build
